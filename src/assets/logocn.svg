<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <g font-family="'Product Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <!-- i (蓝) -->
    <text x="30" y="140" font-size="110" fill="#4285F4">i</text>
    <!-- d (红) -->
    <text x="75" y="140" font-size="110" fill="#EA4335">d</text>
    <!-- o (黄) -->
    <text x="145" y="140" font-size="110" fill="#FBBC05">o</text>
    <!-- a (绿) -->
    <text x="220" y="140" font-size="110" fill="#34A853">a</text>
    
    <!-- 带箭头的 X (红) -->
    <g transform="translate(295, 40)">
      <!-- X 基础斜线 -->
      <path d="M 15 95 L 55 35" stroke="#EA4335" stroke-width="20" stroke-linecap="round"/>
      <!-- X 箭头斜线及头部 -->
      <path d="M 15 35 L 70 5 M 40 5 L 70 5 M 70 5 L 70 35" stroke="#EA4335" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- .com (蓝) -->
    <text x="390" y="140" font-size="105" fill="#4285F4" font-weight="600">.com</text>

    <!-- 中文标语 -->
    <text x="260" y="195" font-size="22" fill="#5F6368" font-weight="500" text-anchor="middle" letter-spacing="4">梦想 · 创新 · 成长</text>
    <text x="260" y="225" font-size="14" fill="#9AA0A6" font-weight="400" text-anchor="middle" letter-spacing="2">成立语 2026 年</text>
  </g>
</svg>
