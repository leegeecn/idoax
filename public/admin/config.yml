backend:
  name: github
  repo: leegeecn/idoax
  branch: main
  base_url: https://www.idoax.com
  auth_endpoint: /api/auth

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "settings"
    label: "一人公司 IP 全站配置"
    delete: false
    files:
      # 1. 品牌与全站基础设置
      - name: "site"
        label: "品牌与站点设置 (Brand & Logo)"
        file: "src/content/site.json"
        fields:
          - { label: "品牌 / IP 名字", name: "brandName", widget: "string", default: "IDOAX" }
          - { label: "全站 Slogan (口号)", name: "slogan", widget: "string", default: "一人公司实践者 · 专注数字内容与技术沉淀" }
          - { label: "品牌 Logo 图片 (可选，留空显示文字 Logo)", name: "logoUrl", widget: "image", required: false }

      # 2. 首页 Hero 与服务展示设置
      - name: "homepage"
        label: "首页品牌与服务展示"
        file: "src/content/homepage.json"
        fields:
          - { label: "首页大标题 (Hero Title)", name: "heroTitle", widget: "string", default: "你好，我是 明 (IDOAX)" }
          - { label: "首页副标题", name: "heroSubtitle", widget: "string", default: "用技术与思考，打造独立高效的数字资产" }
          - { label: "个人 / 品牌介绍 (支持 Markdown)", name: "heroDescription", widget: "markdown" }
          - { label: "CTA 按钮文字 (行动号召)", name: "ctaText", widget: "string", default: "了解我的服务" }
          - { label: "CTA 按钮链接", name: "ctaLink", widget: "string", default: "/services" }
          - label: "一人公司服务 / 产品卡片列表"
            name: "services"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "服务/产品名称", name: "title", widget: "string" }
              - { label: "简短描述", name: "description", widget: "text" }
              - { label: "跳转链接", name: "link", widget: "string", required: false }

      # 3. 顶部导航栏设置
      - name: "navbar"
        label: "顶部导航栏设置"
        file: "src/content/navbar.json"
        fields:
          - label: "导航菜单列表"
            name: "navItems"
            widget: "list"
            summary: "{{fields.label}} ({{fields.url}})"
            fields:
              - { label: "显示名称", name: "label", widget: "string" }
              - { label: "跳转链接 (URL)", name: "url", widget: "string" }
              - { label: "在新标签页打开", name: "external", widget: "boolean", default: false, required: false }

      # 4. 页脚设置
      - name: "footer"
        label: "页脚信息设置"
        file: "src/content/footer.json"
        fields:
          - { label: "版权说明文字", name: "copyright", widget: "string", default: "© 2026 IDOAX. All rights reserved." }
          - { label: "ICP 备案号 / 补充说明", name: "icpText", widget: "string", required: false }
          - label: "页脚社交矩阵外链"
            name: "socialLinks"
            widget: "list"
            required: false
            summary: "{{fields.platform}} ({{fields.url}})"
            fields:
              - { label: "平台名称", name: "platform", widget: "string" }
              - { label: "跳转链接", name: "url", widget: "string" }

      # 5. 主题风格与配色设置
      - name: "theme"
        label: "主题风格与配色设置"
        file: "src/data/theme.json"
        fields:
          - label: "选择全站主题配色方案"
            name: "preset"
            widget: "select"
            default: "warm"
            options:
              - { label: "1. 暖阳 Amber（温暖/温馨/记录成长）", value: "warm" }
              - { label: "2. 森林 Emerald（清新/自然/宁静）", value: "forest" }
              - { label: "3. 蔚蓝 Ocean（简洁/现代/大气）", value: "ocean" }
              - { label: "4. 紫罗兰 Violet（优雅/梦幻/浪漫）", value: "violet" }
              - { label: "5. 玫瑰 Rose（柔和/典雅/高级感）", value: "rose" }
              - { label: "6. 极简黑白 Slate（经典/高对比度/耐看）", value: "slate" }
              - { label: "7. 🎨 自定义配色（在下方设置）", value: "custom" }

          - { label: "【自定义-亮色】页面背景色", name: "customLightFill", widget: "color", default: "#FEFCF8", required: false }
          - { label: "【自定义-亮色】文字颜色", name: "customLightText", widget: "color", default: "#2D2A26", required: false }
          - { label: "【自定义-亮色】主题高亮色", name: "customLightAccent", widget: "color", default: "#E07020", required: false }
          - { label: "【自定义-深色】页面背景色", name: "customDarkFill", widget: "color", default: "#1C1A18", required: false }
          - { label: "【自定义-深色】文字颜色", name: "customDarkText", widget: "color", default: "#F0ECE6", required: false }
          - { label: "【自定义-深色】主题高亮色", name: "customDarkAccent", widget: "color", default: "#F59E0B", required: false }

  # 6. 📸 孩子们的影像地带 (新增相册集合)
  - name: "gallery"
    label: "孩子们的影像地带"
    folder: "src/content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题/主题", name: "title", widget: "string" }
      - { label: "媒体类型", name: "type", widget: "select", options: [{label: "🖼️ 图片", value: "image"}, {label: "🎥 视频", value: "video"}], default: "image" }
      - { label: "Cloudflare 图床/视频 URL", name: "mediaUrl", widget: "string", hint: "例如：https://img.idoax.com/haoran/2026/01.jpg" }
      - { label: "视频封面图 (仅视频类型填，可选)", name: "posterUrl", widget: "string", required: false }
      - { label: "主角专区", name: "child", widget: "select", options: [{label: "浩然", value: "haoran"}, {label: "欣然", value: "xinran"}, {label: "合照/家庭", value: "family"}], default: "family" }
      - { label: "拍摄日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "拍摄地点/活动", name: "location", widget: "string", required: false }
      - { label: "成长温馨描述/感言", name: "description", widget: "text", required: false }

  # 7. 文章管理
  - name: "posts"
    label: "文章管理"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "作者", name: "author", widget: "string", default: "leegeecn" }
      - { label: "发布时间", name: "pubDatetime", widget: "datetime" }
      - { label: "文章简介 (SEO 摘要)", name: "description", widget: "text" }
      - { label: "自定义链接 (SEO Slug)", name: "postSlug", widget: "string", required: false }
      - { label: "草稿模式", name: "draft", widget: "boolean", default: false }
      - { label: "置顶推荐", name: "featured", widget: "boolean", default: false }
      - { label: "标签 (SEO Tags)", name: "tags", widget: "list", default: ["others"] }
      - { label: "正文内容", name: "body", widget: "markdown" }
